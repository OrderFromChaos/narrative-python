[tool.ruff]
line-length = 120
target-version = 'py311'

[tool.ruff.lint]
select = [
    'F', 'E', 'W',        # pyflakes + pycodestyle
    'I',                  # isort
    'N',                  # pep8-naming
    'ANN',                # missing annotations
    'B',                  # bugbear (B006 mutable default)
    'COM',                # trailing commas
    'Q',                  # quotes
    'TID',                # tidy-imports (relative import ban)
    'UP',                 # pyupgrade: modern syntax for the target version
    'SIM',                # flake8-simplify
    'RET',                # flake8-return
    'PTH',                # flake8-use-pathlib. PTH123 bans open() and PTH118 bans os.path.join
    'LOG', 'G',           # logging-format: no f-strings in log calls
]
ignore = [
    'N802',               # function name should be lowercase. The style requires mixedCase
    'ISC001',             # conflicts with the formatter
    'SIM114',            # autofix loses type narrowing (R2b-B5)
    'SIM103',            # makes the last of a run of parallel guards read differently (R4-06)
    'RET504',            # bans naming the result before `return` (R6-06)
    'N806',              # a constant moved into its function stays ALL_CAPS (R3a-12)
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'
multiline-quotes = 'double'
docstring-quotes = 'double'

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = 'all'

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# These ORMs validate in Python what the database already checks: on construction, on save, or on
# every row read. SQLAlchemy, peewee, Piccolo and Django models do none of that and are allowed
# (R10-orm-validation). A one-off script may still use a banned one, with `# ruff: noqa: TID251` in
# its module.
'pydantic'.msg = 'Validate once at a boundary gate. Use a frozen dataclass.'
'sqlmodel'.msg = 'Pydantic-backed ORM. Use SQLAlchemy, or sqlite3 and SQL.'
'ormar'.msg = 'Pydantic-backed ORM. Use SQLAlchemy, or sqlite3 and SQL.'
'tortoise'.msg = 'Validates fields in Python on save. Use SQLAlchemy, or sqlite3 and SQL.'
'pony'.msg = 'Validates in Python on write and on every row read. Use SQLAlchemy, or sqlite3 and SQL.'
'sqlobject'.msg = 'Validates in Python on write and on every row read. Use SQLAlchemy, or sqlite3 and SQL.'

# No per-file-ignores. A lint exception is a property of the module that needs it, so it is declared
# there as a file-level `# ruff: noqa: TID251`. A central glob list drifts from the tree (R7-D04,
# R7-D04-generalised).

[tool.ruff.lint.isort]
lines-after-imports = 2   # R3a-09. isort's default is 1

[tool.ruff.format]
quote-style = 'single'

[tool.pylint.basic]
module-naming-style = 'snake_case'
function-naming-style = 'camelCase'
method-naming-style = 'camelCase'
class-naming-style = 'PascalCase'
const-naming-style = 'UPPER_CASE'
# locals may be snake_case OR ALL_CAPS (R3a-12); arguments and attributes stay strict
variable-rgx = '^([a-z_][a-z0-9_]*|[A-Z][A-Z0-9_]*)$'
argument-naming-style = 'snake_case'
attr-naming-style = 'snake_case'

[tool.pylint.'messages control']
disable = ['all']
enable = ['invalid-name', 'attribute-defined-outside-init']

[tool.mypy]
strict = true
disallow_any_explicit = false
